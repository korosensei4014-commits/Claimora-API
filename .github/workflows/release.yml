name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build publishAllPublicationsToLocalRepository --no-daemon

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E '^version *= *"' build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Publish (only when the version changed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "Release v$VERSION already exists - bump the version in build.gradle.kts to publish a new one."
            exit 0
          fi
          # Maven repository on the `repo` branch (kept across versions).
          git config user.name "korosensei4014-commits"
          git config user.email "237936073+korosensei4014-commits@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin repo > /dev/null; then
            git fetch --depth 1 origin repo
            git worktree add mvn origin/repo
            (cd mvn && git checkout -B repo)
          else
            git worktree add --detach mvn
            (cd mvn && git checkout --orphan repo && git rm -rfq .)
          fi
          cp -r build/repo/. mvn/
          (cd mvn && git add -A && git commit -qm "Claimora API $VERSION" && git push -q origin repo)
          gh release create "v$VERSION" build/libs/claimora-api-$VERSION.jar build/libs/claimora-api-$VERSION-sources.jar \
            --title "Claimora API $VERSION" \
            --notes "Maven: com.korosensei.claimora:claimora-api:$VERSION from https://raw.githubusercontent.com/korosensei4014-commits/Claimora-API/repo/ (see README)."
